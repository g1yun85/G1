name: KCN daily collection
on:
  schedule:
    # Asia/Seoul 07:00, every day (UTC 22:00 on the previous day).
    - cron: '0 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/kcn-daily.yml']
permissions:
  id-token: write
  contents: none
concurrency:
  group: kcn-monitor-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Collect active channels with short-lived identity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { setTimeout as pause } from 'node:timers/promises';
          const endpoint = 'https://kcn-monitor.g1yun85.chatgpt.site/api/automation/daily-collect';
          const deadline = Date.now() + 50 * 60 * 1000;
          let body = {}, failures = 0, completed = false;
          async function call(body) {
            const identityUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            identityUrl.searchParams.set('audience', endpoint);
            const identity = await fetch(identityUrl, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
              signal: AbortSignal.timeout(15000), redirect: 'error'
            });
            if (!identity.ok) throw new Error('IDENTITY_UNAVAILABLE');
            const { value: token } = await identity.json();
            if (typeof token !== 'string') throw new Error('IDENTITY_UNAVAILABLE');
            const response = await fetch(endpoint + '?action=step', {
              method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify(body), signal: AbortSignal.timeout(180000), redirect: 'error'
            });
            // Never print tokens, headers, response bodies or channel details.
            let result;
            try { result = await response.json(); } catch { throw new Error('INVALID_RESPONSE'); }
            return { response, result };
          }
          for (let attempt = 0; attempt < 200 && Date.now() < deadline; attempt++) {
            let response, result;
            try { ({ response, result } = await call(body)); }
            catch { if (++failures > 3) throw new Error('REQUEST_FAILED'); await pause(15000); continue; }
            if ([401, 403].includes(response.status)) throw new Error('AUTHORIZATION_FAILED');
            if (response.status === 429) {
              const delay = Math.min(3600000, Math.max(1500, Number(result.retryAfterMs) || 1500));
              if (Date.now() + delay >= deadline) throw new Error('RUN_NOT_AVAILABLE');
              await pause(delay); continue;
            }
            if (response.status >= 500) {
              if (++failures > 3) throw new Error('SERVER_UNAVAILABLE');
              await pause(15000); continue;
            }
            if (!response.ok || typeof result.runId !== 'string' || !Number.isInteger(result.cursor)) throw new Error('COLLECTION_REJECTED');
            failures = 0;
            body = { runId: result.runId, cursor: result.cursor };
            if (result.done === true) {
              // A repeated start must return the completed daily run, without a new collection.
              await pause(Math.min(30000, Math.max(1500, Number(result.retryAfterMs) || 1500)));
              const repeated = await call({});
              if (repeated.response.status === 429) await pause(2000);
              const checked = repeated.response.status === 429 ? await call({}) : repeated;
              if (!checked.response.ok || checked.result.done !== true || checked.result.runId !== result.runId) throw new Error('REPLAY_CHECK_FAILED');
              completed = true;
              console.log('Collection finished. Detailed results are stored in KCN Monitor.');
              if (result.failureCount > 0 || result.warningCount > 0) throw new Error('COLLECTION_COMPLETED_WITH_CHANNEL_ERRORS');
              break;
            }
            await pause(Math.min(30000, Math.max(300, Number(result.retryAfterMs) || 300)));
          }
          if (!completed) throw new Error('COLLECTION_DEADLINE');
          NODE
